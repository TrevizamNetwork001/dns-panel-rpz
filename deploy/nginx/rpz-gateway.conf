server {
    listen 80;
    listen [::]:80;
    server_name rpz.trevizamnetwork.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/dns-panel-rpz/certbot/www;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name rpz.trevizamnetwork.com.br;

    ssl_certificate /etc/nginx/tls/rpz.trevizamnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/rpz.trevizamnetwork.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 20M;

    access_log /var/log/nginx/rpz-gateway-access.log combined;
    error_log /var/log/nginx/rpz-gateway-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}
