server {

    server_name rpz.trevizamnetwork.com.br;

    root /opt/dns-panel-rpz/public;
    index index.php;

    server_tokens off;
    autoindex off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:bak|backup|conf|config|ini|log|sql|sqlite|sqlite3|db|sh|swp|swo|old|orig|save)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rpz.trevizamnetwork.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rpz.trevizamnetwork.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = rpz.trevizamnetwork.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name rpz.trevizamnetwork.com.br;
    return 404; # managed by Certbot


}
