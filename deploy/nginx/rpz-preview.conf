# Recovered panel and validated customer feeds.
server {
    listen 213.199.47.105:80 default_server;
    listen [2a02:c207:2368:3678::1]:80 default_server;
    server_name _;
    server_tokens off;
    return 302 https://rpz.trevizamnetwork.com.br/bloqueado;
}

server {
    listen 213.199.47.105:80;
    listen [2a02:c207:2368:3678::1]:80;
    server_name rpz.trevizamnetwork.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://rpz.trevizamnetwork.com.br$request_uri; }
}

server {
    listen 213.199.47.105:443 ssl;
    listen [2a02:c207:2368:3678::1]:443 ssl;
    server_name rpz.trevizamnetwork.com.br 213.199.47.105;
    ssl_certificate /preview-tls/certificate.pem;
    ssl_certificate_key /preview-tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 26m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /bloqueado {
        alias /block-page/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        include /etc/nginx/preview-proxy.conf;
    }
}
