# ATENÇÃO — NÃO ESTÁ ATIVO em produção desde a migração (set/2026).
# O `default_server` da porta 443 neste host está sendo reivindicado por
# `ircenter-gateway.conf` (outro site, não relacionado ao RPZ). Antes de
# copiar isto pra /etc/nginx/sites-available/ e habilitar, é preciso decidir
# com o dono do host qual site fica com o default_server (ou usar outro
# mecanismo de catch-all que não conflite com o ircenter). Sem isso, o modo
# `redirect` do RPZ não funciona: hosts desconhecidos caem no ircenter, não
# nesta página. Arquivos estáticos já restaurados em /opt/dns-blocked-page
# (recuperados do backup da migração, `dns-blocked-page.tar.gz`).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/dns-blocked-page/public;
    index index.html;

    server_tokens off;
    autoindex off;

    location / {
        try_files /index.html =404;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /opt/dns-blocked-page/public;
    index index.html;

    server_tokens off;
    autoindex off;

    ssl_certificate /etc/nginx/tls/rpz.trevizamnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/rpz.trevizamnetwork.com.br/privkey.pem;

    location / {
        try_files /index.html =404;
    }
}
