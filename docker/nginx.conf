server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 26m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR "$http_x_forwarded_for, $remote_addr";
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(?:bak|backup|conf|config|ini|log|sql|sqlite|sqlite3|db|sh|old)$ { deny all; }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }
}
