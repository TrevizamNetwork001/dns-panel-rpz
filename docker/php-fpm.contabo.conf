; Preparation only: conservative pool within the app's 768 MiB budget.
; Override inherited pool settings without modifying the legacy image/config.
[www]
pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
request_terminate_timeout = 180s
