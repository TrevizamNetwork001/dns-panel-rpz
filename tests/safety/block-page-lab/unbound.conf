server:
    interface: 127.0.0.1
    port: 15353
    access-control: 127.0.0.0/8 allow
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/tmp"
    pidfile: "/tmp/unbound.pid"
    module-config: "respip iterator"
    local-zone: "test." transparent
    do-not-query-localhost: no
    so-sndbuf: 0
forward-zone:
    name: "."
    forward-addr: 127.0.0.1@15300
rpz:
    name: "rpz-lab.test."
    zonefile: "/lab/redirect.zone"
