# Recovered runtime. Never combine with the legacy production compose.yml.
# Validated recovered runtime; HTTP feeds enabled, optional DNS primary disabled.
name: dns-panel-rpz-staging

x-runtime: &runtime
  image: dns-panel-rpz-app:feeds-12h-20261023
  build:
    context: .
    dockerfile: docker/Dockerfile.contabo
    target: app
  env_file: [./.env.staging]
  environment: &recovery-environment
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://rpz.trevizamnetwork.com.br
    SESSION_SECURE_COOKIE: "true"
    DB_DATABASE: /data/database.sqlite
    DB_QUEUE_RETRY_AFTER: "900"
    RPZ_ENDPOINTS_ENABLED: "true"
    RPZ_PUBLICATION_ENABLED: "true"
    RPZ_STATIC_ARTIFACTS_ENABLED: "true"
    RPZ_NOTIFY_ENABLED: "false"
    RPZ_PRIMARY_ENABLED: "false"
    EXTERNAL_SYNC_ENABLED: "true"
    VIEW_COMPILED_PATH: /tmp/compiled-views
    LOG_CHANNEL: stderr
  networks: [isolated, ingress]
  volumes:
    - staging-data:/data
    - staging-storage:/var/www/html/storage
    - staging-cache:/var/www/html/bootstrap/cache
    - staging-backups:/backups
    - ./app/Models/AuditLog.php:/var/www/html/app/Models/AuditLog.php:ro
    - ./app/Http/Controllers/AuditoriaController.php:/var/www/html/app/Http/Controllers/AuditoriaController.php:ro
    - ./app/Http/Controllers/DashboardController.php:/var/www/html/app/Http/Controllers/DashboardController.php:ro
    - ./resources/views/auditoria/index.blade.php:/var/www/html/resources/views/auditoria/index.blade.php:ro
  read_only: true
  tmpfs: [/tmp]
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  init:
    <<: *runtime
    user: root
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    # Refuse to create or initialize an empty database.
    command:
      - /bin/sh
      - -ec
      - |
        test -s /data/database.sqlite
        test "$$(sqlite3 -readonly /data/database.sqlite 'PRAGMA integrity_check;')" = ok
        test "$$(sqlite3 -readonly /data/database.sqlite 'SELECT count(*) FROM empresas;')" -gt 0
        exec /usr/local/bin/rpz-init
    restart: "no"
    healthcheck: {disable: true}
    mem_limit: 128m
    cpus: "0.25"

  app:
    <<: *runtime
    # Key supplied securely; never generated by container startup.
    command: [/bin/sh, -ec, 'test -n "$$APP_KEY" || { echo "APP_KEY pendente" >&2; exit 1; }; exec php-fpm -F']
    depends_on:
      init: {condition: service_completed_successfully}
    mem_limit: 768m
    cpus: "1.00"

  nginx:
    image: dns-panel-rpz-web:repair-20261022
    build:
      context: .
      dockerfile: docker/Dockerfile.contabo
      target: web
    depends_on:
      app: {condition: service_healthy}
    networks: [isolated, ingress]
    ports: ["127.0.0.1:8082:8080"]
    volumes:
      - staging-storage:/var/www/html/storage:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  queue:
    <<: *runtime
    command: [php, artisan, queue:work, database, "--queue=anatel-preview,default", "--sleep=2", "--tries=1", "--timeout=360", "--max-time=3600"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    stop_grace_period: 700s
    mem_limit: 768m
    cpus: "0.75"

  scheduler:
    <<: *runtime
    command: [php, artisan, schedule:work, --no-interaction]
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    mem_limit: 384m
    cpus: "0.50"

  external-sync:
    <<: *runtime
    command: [/usr/local/bin/rpz-automation, external-sync]
    environment:
      <<: *recovery-environment
      AUTOMATION_INTERVAL: "21600"
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    mem_limit: 384m
    cpus: "0.50"

  backup:
    <<: *runtime
    command: [/usr/local/bin/rpz-automation, backup]
    environment:
      <<: *recovery-environment
      AUTOMATION_INTERVAL: "3600"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "14"
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    stop_grace_period: 660s
    mem_limit: 384m
    cpus: "0.25"

networks:
  isolated:
    internal: true
  # Gateway ingress and egress for manual/automatic external integrations.
  ingress: {}

volumes:
  # Disposable test database; dns-panel-rpz-staging-data preserves recovery.
  staging-data: {external: true, name: dns-panel-rpz-staging-test-data}
  staging-storage: {external: true, name: dns-panel-rpz-staging-storage}
  staging-cache: {external: true, name: dns-panel-rpz-staging-cache}
  staging-backups: {external: true, name: dns-panel-rpz-staging-backups}
