# Recovered runtime. Never combine with the legacy production compose.yml.
# Recovered runtime; HTTPS feeds and IPv4/IPv6 RPZ SOA primary enabled.
name: dns-panel-rpz-staging

x-runtime: &runtime
  image: dns-panel-rpz-app:rpz-company-primary-20261023
  build:
    context: .
    dockerfile: docker/Dockerfile.contabo
    target: app
  env_file: [./.env.staging]
  environment: &recovery-environment
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://rpz.trevizamnetwork.com.br
    RPZ_FEED_BASE_URL: https://feeds.trevizamnetwork.com.br
    SESSION_SECURE_COOKIE: "true"
    DB_DATABASE: /data/database.sqlite
    DB_QUEUE_RETRY_AFTER: "900"
    RPZ_ENDPOINTS_ENABLED: "true"
    RPZ_PUBLICATION_ENABLED: "true"
    RPZ_STATIC_ARTIFACTS_ENABLED: "true"
    RPZ_NOTIFY_ENABLED: "true"
    RPZ_NOTIFY_SERVER_IDS: "15"
    RPZ_PRIMARY_COMPANY_SERVER_IDS: "15"
    RPZ_NOTIFY_IPV6_ENABLED: "false"
    RPZ_PRIMARY_ENABLED: "false"
    EXTERNAL_SYNC_ENABLED: "true"
    VIEW_COMPILED_PATH: /tmp/compiled-views
    LOG_CHANNEL: stderr
    DB_TRANSACTION_MODE: IMMEDIATE
    HEALTH_DISK_PATH: /data
    HEALTH_CERT_PATH: /var/www/html/storage/app/private/health/certificate.pem
  networks: [isolated, ingress]
  volumes:
    - staging-data:/data
    - staging-storage:/var/www/html/storage
    - staging-cache:/var/www/html/bootstrap/cache
    - staging-backups:/backups
  read_only: true
  tmpfs: [/tmp]
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  init:
    <<: *runtime
    user: root
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    # Refuse to create or initialize an empty database.
    command:
      - /bin/sh
      - -ec
      - |
        test -s /data/database.sqlite
        test "$$(sqlite3 -readonly /data/database.sqlite 'PRAGMA integrity_check;')" = ok
        test "$$(sqlite3 -readonly /data/database.sqlite 'SELECT count(*) FROM empresas;')" -gt 0
        exec /usr/local/bin/rpz-init
    restart: "no"
    healthcheck: {disable: true}
    mem_limit: 128m
    cpus: "0.25"

  app:
    <<: *runtime
    image: dns-panel-rpz-app:rpz-feeds-20261026
    build:
      context: .
      dockerfile: docker/Dockerfile.rpz-feeds-overlay
    # Key supplied securely; never generated by container startup.
    command: [/bin/sh, -ec, 'test -n "$$APP_KEY" || { echo "APP_KEY pendente" >&2; exit 1; }; exec php-fpm -F']
    depends_on:
      init: {condition: service_completed_successfully}
    mem_limit: 768m
    cpus: "1.00"

  # Host networking preserves the source IPv6 address for the RPZ ACL.
  rpz-primary: &rpz-primary-runtime
    env_file: [./.env.staging]
    volumes:
      - staging-data:/data
      - staging-storage:/var/www/html/storage
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    image: dns-panel-rpz-app:rpz-company-primary-20261023
    network_mode: host
    user: "0:0"
    # Root binds UDP/53; DAC_OVERRIDE permits access to www-data-owned runtime volumes.
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE]
    command: [php, artisan, 'rpz:primary-serve']
    environment:
      <<: *recovery-environment
      RPZ_PRIMARY_ENABLED: "true"
      RPZ_PRIMARY_PORT: "53"
      RPZ_PRIMARY_BIND: "213.199.47.105"
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    mem_limit: 192m
    cpus: "0.25"

  rpz-primary-v6:
    <<: *rpz-primary-runtime
    environment:
      <<: *recovery-environment
      RPZ_PRIMARY_ENABLED: "true"
      RPZ_PRIMARY_PORT: "53"
      RPZ_PRIMARY_BIND: "2a02:c207:2368:3678::1"

  nginx:
    image: dns-panel-rpz-web:ecosystem-fixes-20261023
    build:
      context: .
      dockerfile: docker/Dockerfile.contabo
      target: web
    depends_on:
      app: {condition: service_healthy}
    networks: [isolated, ingress]
    ports: ["127.0.0.1:8082:8080"]
    volumes:
      - staging-storage:/var/www/html/storage:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  queue:
    <<: *runtime
    stop_signal: SIGTERM
    command: [php, artisan, queue:work, database, "--queue=anatel-preview,default", "--sleep=2", "--tries=1", "--timeout=360", "--max-time=3600"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    stop_grace_period: 700s
    mem_limit: 768m
    cpus: "0.75"

  scheduler:
    <<: *runtime
    stop_signal: SIGTERM
    command: [php, artisan, schedule:work, --no-interaction]
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    mem_limit: 384m
    cpus: "0.50"

  external-sync:
    <<: *runtime
    stop_signal: SIGTERM
    command: [/usr/local/bin/rpz-automation, external-sync]
    environment:
      <<: *recovery-environment
      AUTOMATION_INTERVAL: "21600"
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    mem_limit: 384m
    cpus: "0.50"

  backup:
    <<: *runtime
    stop_signal: SIGTERM
    command: [/usr/local/bin/rpz-automation, backup]
    environment:
      <<: *recovery-environment
      AUTOMATION_INTERVAL: "3600"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "14"
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    stop_grace_period: 660s
    mem_limit: 384m
    cpus: "0.25"

networks:
  isolated:
    internal: true
  # Gateway ingress and egress for manual/automatic external integrations.
  ingress: {}

volumes:
  # Disposable test database; dns-panel-rpz-staging-data preserves recovery.
  staging-data: {external: true, name: dns-panel-rpz-staging-test-data}
  staging-storage: {external: true, name: dns-panel-rpz-staging-storage}
  staging-cache: {external: true, name: dns-panel-rpz-staging-cache}
  staging-backups: {external: true, name: dns-panel-rpz-staging-backups}
