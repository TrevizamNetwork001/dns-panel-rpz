name: Testes

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configura PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, mbstring, dom, curl, fileinfo
          coverage: none

      - name: Instala dependencias do Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepara .env de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Roda a suite de testes
        run: php artisan test
