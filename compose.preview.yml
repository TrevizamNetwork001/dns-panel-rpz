# Host networking preserves client IPv6 addresses (bridge IPv6-to-IPv4 loses them).
name: dns-panel-rpz-preview
services:
  gateway:
    image: dns-panel-rpz-web:staging
    user: "0:0"
    entrypoint: [nginx]
    command: [-c, /etc/nginx/preview-main.conf, -g, "daemon off;"]
    network_mode: host
    volumes:
      - ./deploy/nginx/rpz-preview-main.conf:/etc/nginx/preview-main.conf:ro
      - ./deploy/nginx/rpz-preview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/rpz-preview-proxy.conf:/etc/nginx/preview-proxy.conf:ro
      - ./.recovery/preview-tls:/preview-tls:ro
      - ./.recovery/acme:/var/www/acme:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # Master binds public ports; workers drop to the image's nginx user.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, "https://213.199.47.105/login"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
